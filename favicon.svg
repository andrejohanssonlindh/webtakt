<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Webtakt knob favicon: matte-black dial, amber pointer (brand accent #e8a020) -->
  <rect width="64" height="64" rx="12" fill="#141414"/>
  <!-- outer dial -->
  <circle cx="32" cy="32" r="20" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="2"/>
  <!-- tick marks around the dial -->
  <g stroke="#6a5018" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="9"  x2="32" y2="14"/>
    <line x1="48.3" y1="15.7" x2="44.8" y2="19.2"/>
    <line x1="55" y1="32" x2="50" y2="32"/>
    <line x1="48.3" y1="48.3" x2="44.8" y2="44.8"/>
    <line x1="15.7" y1="48.3" x2="19.2" y2="44.8"/>
    <line x1="9" y1="32" x2="14" y2="32"/>
    <line x1="15.7" y1="15.7" x2="19.2" y2="19.2"/>
  </g>
  <!-- knob cap -->
  <circle cx="32" cy="32" r="13" fill="#262626" stroke="#e8a020" stroke-width="1.5"/>
  <!-- pointer (points up-left, ~10 o'clock) -->
  <line x1="32" y1="32" x2="23.5" y2="23.5" stroke="#e8a020" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="2.5" fill="#e8a020"/>
</svg>
