<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webtakt</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="app">

    <!-- TRANSPORT -->
    <div id="transport">
      <span class="transport-title">WEBTAKT</span>
      <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
      <button id="btn-manual" class="icon-btn" title="Manual" aria-label="Manual">📖</button>
      <div class="sep"></div>
      <button id="btn-play" class="btn">▶ PLAY</button>
      <button id="btn-stop-all" class="btn" title="Stop transport, kill all sound, exit record">■ STOP ALL</button>
      <button id="btn-rec" class="btn">⏺ REC</button>
      <button id="btn-tape" class="btn">⏺ TAPE</button>
      <button id="btn-drum" class="btn">DRUM</button>
      <div class="sep"></div>
      <span class="bpm-label">BPM</span>
      <span id="bpm-display">120</span>
      <input id="bpm-slider" type="range" min="20" max="300" value="120" step="1" />
      <div class="transport-right">
        <button id="btn-hold" class="btn">HOLD</button>
        <div class="sep"></div>
        <button id="btn-clear-notes" class="btn">CLR NOTES</button>
        <button id="btn-clear-track" class="btn">CLR TRACK</button>
        <button id="btn-clear-notes-all" class="btn">CLR NOTES ALL</button>
        <button id="btn-clear-all" class="btn">CLR ALL</button>
        <div class="sep"></div>
        <div class="track-count-ctrl">
          <span class="track-count-label">TRACKS</span>
          <button id="btn-tracks-minus" class="btn track-count-btn">−</button>
          <span id="track-count-display">8</span>
          <button id="btn-tracks-plus" class="btn track-count-btn">+</button>
        </div>
        <div class="sep"></div>
        <button id="btn-export" class="btn">EXPORT</button>
        <label class="btn" style="cursor:pointer;">
          IMPORT
          <input id="btn-import" type="file" accept=".json" style="display:none" />
        </label>
      </div>
    </div>

    <!-- TRACK ROW -->
    <div id="track-row"></div>

    <!-- SYNTH PANELS -->
    <div id="synth-panel"></div>

    <!-- MIDDLE ROW: step grid | track nav (page + length) -->
    <div id="middle-row">
      <div id="step-grid"></div>
      <div id="track-nav">
        <div id="track-nav-page-counter">1/1</div>
        <button id="track-nav-next" class="btn track-nav-btn">&#9658;</button>
        <button id="track-nav-length" class="btn track-nav-btn">LEN</button>
      </div>
    </div>

    <!-- LENGTH POPUP -->
    <div id="length-popup" style="display:none">
      <div class="length-popup-label">TRACK LENGTH</div>
      <div class="length-popup-steps" id="length-popup-steps">16</div>
      <div class="length-popup-row">
        <button class="btn length-popup-btn" id="lp-minus16">-16</button>
        <button class="btn length-popup-btn" id="lp-minus1">-1</button>
        <button class="btn length-popup-btn" id="lp-plus1">+1</button>
        <button class="btn length-popup-btn" id="lp-plus16">+16</button>
      </div>
    </div>

    <!-- KEYBOARD ROW -->
    <div id="keyboard-row">
      <div id="mod-wheels"></div>
      <div id="keyboard"></div>
      <div id="octave-controls"></div>
    </div>

    <!-- CONFIRM / PROMPT MODAL -->
    <div id="confirm-modal" class="modal-overlay" style="display:none">
      <div class="modal-box">
        <p id="confirm-msg"></p>
        <input id="confirm-input" type="text" class="modal-input" style="display:none" />
        <div class="modal-btns">
          <button id="confirm-cancel" class="btn">CANCEL</button>
          <button id="confirm-ok" class="btn modal-btn-ok">OK</button>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="./js/boot.js"></script>

</body>
</html>
