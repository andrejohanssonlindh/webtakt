<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATINA — analog-modelling synth demo</title>
<style>
  :root{
    --panel:#2b2622; --panel-edge:#1a1714; --ink:#e8ddc8; --ink-dim:#8f8472;
    --accent:#e0862e; --accent-hot:#f2a14d; --key-w:#efe7d6; --key-b:#241f1b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#14110e;
    background-image:radial-gradient(ellipse at 50% -20%, #2a2017 0%, #14110e 60%);
    font-family:"Futura","Jost","Century Gothic",ui-sans-serif,sans-serif;
    color:var(--ink); padding:24px;
  }
  .unit{
    width:min(960px,100%);
    background:linear-gradient(180deg,#332d27,var(--panel) 12%,var(--panel) 88%,#211c18);
    border:1px solid var(--panel-edge); border-radius:10px;
    box-shadow:0 30px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    padding:26px 30px 30px;
  }
  .screw{width:10px;height:10px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#9a8f7d,#3a332b 70%);
    position:relative}
  .screw::after{content:"";position:absolute;inset:4px 1px;background:#241f1a;height:1.5px;top:4.5px;transform:rotate(38deg)}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    border-bottom:1.5px solid #4a4138;padding-bottom:14px;margin-bottom:18px}
  .brandrow{display:flex;align-items:center;gap:14px;width:100%}
  h1{font-size:30px;letter-spacing:.32em;margin:0;font-weight:600;flex:1}
  h1 small{display:block;font-size:10px;letter-spacing:.28em;color:var(--ink-dim);margin-top:2px}
  .lamp{width:9px;height:9px;border-radius:50%;background:#5a1d10;box-shadow:0 0 0 2px #1d1916;transition:.15s}
  .lamp.on{background:var(--accent-hot);box-shadow:0 0 10px var(--accent),0 0 0 2px #1d1916}
  .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px 20px;margin-bottom:20px}
  .ctl label{display:block;font-size:9.5px;letter-spacing:.22em;color:var(--ink-dim);
    text-transform:uppercase;margin-bottom:6px;text-align:center}
  .ctl output{display:block;text-align:center;font-size:10px;color:var(--accent-hot);
    font-family:ui-monospace,monospace;margin-top:4px;min-height:13px}
  input[type=range]{-webkit-appearance:none;width:100%;height:26px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
    background:linear-gradient(90deg,#15110e,#15110e);box-shadow:inset 0 1px 2px #000}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:26px;margin-top:-11px;
    border-radius:3px;background:linear-gradient(180deg,#6b6258,#3b342d);
    border:1px solid #15110e;box-shadow:0 2px 4px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08)}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#15110e}
  input[type=range]::-moz-range-thumb{width:14px;height:24px;border-radius:3px;
    background:linear-gradient(180deg,#6b6258,#3b342d);border:1px solid #15110e}
  select{width:100%;background:#1b1713;color:var(--ink);border:1px solid #4a4138;border-radius:4px;
    padding:7px 8px;font:inherit;font-size:12px;letter-spacing:.06em}
  .row2{display:flex;gap:20px;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap}
  .presetbox{flex:1;min-width:220px}
  .presetbox label{font-size:9.5px;letter-spacing:.22em;color:var(--ink-dim);text-transform:uppercase;display:block;margin-bottom:6px}
  button.panicbtn{background:#3a201a;color:#e9b9a4;border:1px solid #5d2c20;border-radius:4px;
    padding:8px 16px;font:inherit;font-size:11px;letter-spacing:.18em;cursor:pointer}
  button.panicbtn:hover{background:#4b2820}
  .kbd{display:flex;position:relative;height:150px;border-radius:6px;overflow:hidden;
    border:1px solid #15110e;box-shadow:inset 0 6px 12px rgba(0,0,0,.45);user-select:none;touch-action:none}
  .key{flex:1;background:linear-gradient(180deg,#f4ecdc,var(--key-w) 70%,#d8cfba);
    border-right:1px solid #b8ae97;position:relative;cursor:pointer}
  .key:last-child{border-right:none}
  .key .qkey{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:9px;
    color:#8b8068;letter-spacing:.1em;font-family:ui-monospace,monospace}
  .key.black{position:absolute;width:6.4%;height:58%;top:0;z-index:2;
    background:linear-gradient(180deg,#36302a,var(--key-b) 60%,#0d0b09);
    border:1px solid #0d0b09;border-radius:0 0 4px 4px;box-shadow:0 3px 5px rgba(0,0,0,.5)}
  .key.black .qkey{color:#7a705f}
  .key.down{background:linear-gradient(180deg,#e2cfa6,#d9bf8a)}
  .key.black.down{background:linear-gradient(180deg,#4a3c2c,#2a2118)}
  footer{margin-top:14px;display:flex;justify-content:space-between;align-items:center;
    font-size:9.5px;letter-spacing:.18em;color:var(--ink-dim);text-transform:uppercase}
  .gate{position:fixed;inset:0;background:rgba(10,8,6,.85);display:flex;align-items:center;
    justify-content:center;z-index:10;backdrop-filter:blur(3px)}
  .gate button{background:var(--accent);border:none;color:#1c1207;font:inherit;font-size:14px;
    letter-spacing:.3em;padding:18px 40px;border-radius:6px;cursor:pointer;text-transform:uppercase}
  .gate button:hover{background:var(--accent-hot)}
  @media (max-width:620px){ .key .qkey{display:none} h1{font-size:22px} }
</style>
</head>
<body>

<div class="gate" id="gate"><button id="powerBtn">⏻ &nbsp;Power on</button></div>

<div class="unit">
  <header>
    <div class="brandrow">
      <div class="screw"></div>
      <h1>PATINA <small>analog-modelling synthesizer · web audio</small></h1>
      <div class="lamp" id="lamp"></div>
      <div class="screw"></div>
    </div>
  </header>

  <div class="row2">
    <div class="presetbox">
      <label>Program</label>
      <select id="preset"></select>
    </div>
    <button class="panicbtn" id="panic">PANIC</button>
  </div>

  <div class="controls" id="controls"></div>

  <div class="kbd" id="kbd"></div>

  <footer>
    <span>Keys A–K = white · W E T Y U = black · Z/X octave</span>
    <span id="octlabel">OCT 4</span>
  </footer>
</div>

<script type="module">
import { PatinaSynth, PRESETS } from './patina.js';

const synth = new PatinaSynth();
window.synth = synth; // poke it from the console

/* ── controls: [label, get path apply fn, min, max, step, init, fmt] ── */
const ctls = [
  ['Cutoff',   v => synth.set({filter:{cutoff:v}}),            60, 8000, 1,   1400, v=>v+' Hz'],
  ['Resonance',v => synth.set({filter:{resonance:v}}),         0, 1.15, .01,  .25,  v=>v.toFixed(2)],
  ['Filter drive', v => synth.set({filter:{drive:v}}),         .5, 8,  .1,    1.6,  v=>v.toFixed(1)],
  ['Drift',    v => synth.set({character:{drift:v}}),          0, 1,  .01,    .5,   v=>Math.round(v*100)+'%'],
  ['Hiss + hum',v=> synth.set({character:{noiseFloor:v, hum:v*.6}}), 0,1,.01, .35,  v=>Math.round(v*100)+'%'],
  ['Chorus',   v => synth.set({fx:{chorus:{mix:v}}}),          0, 1,  .01,    0,    v=>Math.round(v*100)+'%'],
  ['Reverb',   v => synth.set({fx:{reverb:{mix:v}}}),          0, 1,  .01,    0,    v=>Math.round(v*100)+'%'],
  ['Out drive',v => synth.set({fx:{drive:v}}),                 0, 1,  .01,    .25,  v=>Math.round(v*100)+'%'],
];
const controlsEl = document.getElementById('controls');
const sliders = [];
for (const [label, apply, min, max, step, init, fmt] of ctls) {
  const d = document.createElement('div'); d.className = 'ctl';
  d.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${init}"><output>${fmt(init)}</output>`;
  const input = d.querySelector('input'), out = d.querySelector('output');
  input.addEventListener('input', () => { const v = +input.value; apply(v); out.textContent = fmt(v); });
  controlsEl.appendChild(d);
  sliders.push({ label, input, out, fmt });
}

/* keep sliders in sync after a preset load */
function syncSliders() {
  const p = synth.getParams();
  const vals = [p.filter.cutoff, p.filter.resonance, p.filter.drive, p.character.drift,
                p.character.noiseFloor, p.fx.chorus.mix, p.fx.reverb.mix, p.fx.drive];
  sliders.forEach((s, i) => { s.input.value = vals[i]; s.out.textContent = s.fmt(+vals[i]); });
}

/* ── presets ── */
const presetEl = document.getElementById('preset');
for (const name of Object.keys(PRESETS)) {
  const o = document.createElement('option'); o.value = o.textContent = name;
  presetEl.appendChild(o);
}
presetEl.value = 'warm-pad';
presetEl.addEventListener('change', () => { synth.loadPreset(presetEl.value); syncSliders(); });

document.getElementById('panic').addEventListener('click', () => synth.panic());

/* ── keyboard ── */
const kbd = document.getElementById('kbd');
const lamp = document.getElementById('lamp');
let octave = 4, activeNotes = 0;
const WHITE = [0,2,4,5,7,9,11,12,14,16];           // C D E F G A B C D E
const BLACK = [[1,1],[3,2],[6,4],[8,5],[10,6]];    // [semitone, after-which-white]
const QWHITE = ['A','S','D','F','G','H','J','K','L',';'];
const QBLACK = ['W','E','T','Y','U'];
const keyEls = new Map();

function buildKeys() {
  kbd.innerHTML = ''; keyEls.clear();
  WHITE.forEach((semi, i) => {
    const k = document.createElement('div'); k.className = 'key';
    k.innerHTML = `<span class="qkey">${QWHITE[i] ?? ''}</span>`;
    k.dataset.semi = semi; kbd.appendChild(k); keyEls.set(semi, k);
  });
  const wW = 100 / WHITE.length;
  BLACK.forEach(([semi, afterWhite], i) => {
    const k = document.createElement('div'); k.className = 'key black';
    k.style.left = `calc(${afterWhite * wW}% - 3.2%)`;
    k.innerHTML = `<span class="qkey">${QBLACK[i]}</span>`;
    k.dataset.semi = semi; kbd.appendChild(k); keyEls.set(semi, k);
  });
}
buildKeys();

const midiOf = semi => 12 * (octave + 1) + semi;
function press(semi, vel = 0.8) {
  synth.noteOn(midiOf(semi), vel);
  keyEls.get(semi)?.classList.add('down');
  activeNotes++; lamp.classList.add('on');
}
function release(semi) {
  synth.noteOff(midiOf(semi));
  keyEls.get(semi)?.classList.remove('down');
  activeNotes = Math.max(0, activeNotes - 1);
  if (!activeNotes) lamp.classList.remove('on');
}

/* pointer */
let pointerSemi = null;
kbd.addEventListener('pointerdown', e => {
  const k = e.target.closest('.key'); if (!k) return;
  kbd.setPointerCapture(e.pointerId);
  pointerSemi = +k.dataset.semi; press(pointerSemi);
});
kbd.addEventListener('pointermove', e => {
  if (pointerSemi === null) return;
  const k = document.elementFromPoint(e.clientX, e.clientY)?.closest('.key');
  if (k && +k.dataset.semi !== pointerSemi) { release(pointerSemi); pointerSemi = +k.dataset.semi; press(pointerSemi); }
});
const lift = () => { if (pointerSemi !== null) release(pointerSemi); pointerSemi = null; };
kbd.addEventListener('pointerup', lift);
kbd.addEventListener('pointercancel', lift);

/* computer keyboard */
const KEYMAP = { a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,l:14,';':16,o:13,p:15 };
const held = new Set();
addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey) return;
  const key = e.key.toLowerCase();
  if (key === 'z') { octave = Math.max(1, octave - 1); octLabel(); return; }
  if (key === 'x') { octave = Math.min(7, octave + 1); octLabel(); return; }
  if (key in KEYMAP && !held.has(key)) { held.add(key); press(KEYMAP[key]); }
});
addEventListener('keyup', e => {
  const key = e.key.toLowerCase();
  if (held.delete(key)) release(KEYMAP[key]);
});
const octLabel = () => document.getElementById('octlabel').textContent = 'OCT ' + octave;

/* ── power gate (user gesture for the AudioContext) ── */
document.getElementById('powerBtn').addEventListener('click', async () => {
  await synth.ready;
  await synth.resume();
  synth.loadPreset('warm-pad');
  syncSliders();
  document.getElementById('gate').remove();
});
</script>
</body>
</html>
